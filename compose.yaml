services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure.py first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U school -d school]
      interval: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://school:${POSTGRES_PASSWORD}@db:5432/school
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
