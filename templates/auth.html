{% extends 'base.html' %}{% block body %}<section class="narrow"><h1>{{ 'Создать аккаунт' if register else 'С возвращением' }}</h1><p>{{ 'Запись на курс оформляет администратор школы.' if register else 'Войдите, чтобы продолжить обучение.' }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if register %}<label>Имя<input name="name" required maxlength="100" autocomplete="name"></label><label>Телефон<input name="phone" maxlength="40" autocomplete="tel"></label>{% endif %}<label>Email<input type="email" name="email" required maxlength="254" autocomplete="username"></label><label>Пароль<input type="password" name="password" required maxlength="128" {% if register %}minlength="12" autocomplete="new-password"{% else %}autocomplete="current-password"{% endif %}></label><button>{{ 'Зарегистрироваться' if register else 'Войти' }}</button></form></section>{% endblock %}
